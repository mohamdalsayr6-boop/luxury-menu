<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Luxury Menu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Amiri:wght@400;700&display=swap');
        
        :root {
            --bg-color: #0a0a0a;
            --text-color: #f4f4f4;
            --accent-color: #d4af37;
            --card-bg: #111;
        }
        
        body {
            font-family: 'Playfair Display', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            padding-bottom: 80px;
        }
        
        .header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px solid #333;
        }
        
        h1 {
            font-family: 'Cinzel', serif;
            color: var(--accent-color);
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }
        
        .categories {
            display: flex;
            overflow-x: auto;
            padding: 15px;
            gap: 15px;
            background: #1a1a1a;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .categories::-webkit-scrollbar { display: none; }
        
        .cat-btn {
            background: transparent;
            color: #888;
            border: 1px solid #333;
            padding: 8px 20px;
            border-radius: 30px;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.3s;
        }
        
        .cat-btn.active, .cat-btn:hover {
            color: var(--bg-color);
            background: var(--accent-color);
            border-color: var(--accent-color);
        }
        
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            padding: 20px;
        }
        
        .menu-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #222;
        }
        
        .img-container {
            width: 100%;
            height: 220px;
            background: #222;
        }
        
        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .details {
            padding: 20px;
        }
        
        .name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--accent-color);
        }
        
        .desc {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .price {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            font-weight: 700;
        }
        
        .add-btn {
            background: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .add-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>THE GRAND MENU</h1>
        <p style="color: #888; margin-top: 10px;">Fine Dining Experience</p>
    </div>

    <div class="categories" id="categories">
        <!-- Categories will be injected here -->
    </div>

    <div class="menu-grid" id="menu-grid">
        <!-- Menu items will be injected here -->
    </div>

    <script>
        const categories = ["All", "Seafood & Sushi", "Premium Steaks", "Italian Fine Dining", "Signature Drinks"];
        
        const menuItems = [
            { name: "Lobster Tail", cat: "Seafood & Sushi", desc: "Butter-poached lobster with garlic and herbs", price: "45.00", img: "https://images.unsplash.com/photo-1559742811-822873691df8?w=800&q=80" },
            { name: "Premium Sushi Platter", cat: "Seafood & Sushi", desc: "Chef's selection of fresh sashimi and nigiri", price: "55.00", img: "https://images.unsplash.com/photo-1579871494447-0811cf80d49d?w=800&q=80" },
            { name: "Grilled Salmon", cat: "Seafood & Sushi", desc: "Wild-caught salmon with asparagus and hollandaise", price: "32.00", img: "https://images.unsplash.com/photo-1485921325833-c519f76c4927?w=800&q=80" },
            
            { name: "Tomahawk Ribeye", cat: "Premium Steaks", desc: "32oz bone-in ribeye, grilled to perfection", price: "89.00", img: "https://images.unsplash.com/photo-1544025162-8a38304918e5?w=800&q=80" },
            { name: "Filet Mignon", cat: "Premium Steaks", desc: "Tender 8oz cut with red wine reduction", price: "48.00", img: "https://images.unsplash.com/photo-1600891964092-4316c288032e?w=800&q=80" },
            { name: "Wagyu A5 Striploin", cat: "Premium Steaks", desc: "Authentic Japanese Wagyu, melt-in-your-mouth texture", price: "120.00", img: "https://images.unsplash.com/photo-1558030006-450675393462?w=800&q=80" },
            
            { name: "Truffle Risotto", cat: "Italian Fine Dining", desc: "Arborio rice with fresh black truffle and parmesan", price: "28.00", img: "https://images.unsplash.com/photo-1633504581786-316c8002b1b3?w=800&q=80" },
            { name: "Burrata Salad", cat: "Italian Fine Dining", desc: "Fresh burrata, heirloom tomatoes, basil oil", price: "22.00", img: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=800&q=80" },
            { name: "Handmade Ravioli", cat: "Italian Fine Dining", desc: "Stuffed with ricotta and spinach in sage butter", price: "26.00", img: "https://images.unsplash.com/photo-1551183053-bf91a1d81141?w=800&q=80" },
            
            { name: "Tropical Sunset Mocktail", cat: "Signature Drinks", desc: "Mango, passionfruit, and sparkling water", price: "12.00", img: "https://images.unsplash.com/photo-1536935338-7866a084ba6f?w=800&q=80" },
            { name: "Classic Crème Brûlée", cat: "Signature Drinks", desc: "Rich vanilla custard with a caramelized shell", price: "14.00", img: "https://images.unsplash.com/photo-1473093295043-cdd812d0e601?w=800&q=80" },
            { name: "Artisan Macarons", cat: "Signature Drinks", desc: "Assortment of French macarons", price: "16.00", img: "https://images.unsplash.com/photo-1569864358642-9d1684040f43?w=800&q=80" }
        ];

        const catContainer = document.getElementById('categories');
        const menuContainer = document.getElementById('menu-grid');

        categories.forEach((cat, index) => {
            const btn = document.createElement('button');
            btn.className = `cat-btn ${index === 0 ? 'active' : ''}`;
            btn.textContent = cat;
            btn.onclick = () => filterMenu(cat, btn);
            catContainer.appendChild(btn);
        });

        function renderMenu(items) {
            menuContainer.innerHTML = '';
            items.forEach(item => {
                const card = `
                    <div class="menu-card">
                        <div class="img-container">
                            <img src="${item.img}" alt="${item.name}" loading="lazy">
                        </div>
                        <div class="details">
                            <div class="name">${item.name}</div>
                            <div class="desc">${item.desc}</div>
                            <div class="price-row">
                                <div class="price">€${item.price}</div>
                                <button class="add-btn">Add +</button>
                            </div>
                        </div>
                    </div>
                `;
                menuContainer.innerHTML += card;
            });
        }

        function filterMenu(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            if(cat === "All") {
                renderMenu(menuItems);
            } else {
                renderMenu(menuItems.filter(item => item.cat === cat));
            }
        }

        renderMenu(menuItems);
    </script>
</body>
</html>
